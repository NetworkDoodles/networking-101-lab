hostname r1
!
! The home network's DHCP server: addresses from .100 up, the gateway, the DNS server and the domain.
ip dhcp excluded-address 192.168.1.1 192.168.1.99
!
ip dhcp pool HOME
 network 192.168.1.0 255.255.255.0
 default-router 192.168.1.1
 dns-server 192.168.2.53
 domain-name lab
 lease 0 1
!
interface GigabitEthernet1
 description home network (sw1)
 ip address 192.168.1.1 255.255.255.0
 no shutdown
!
interface GigabitEthernet2
 description link to r2
 ip address 10.0.0.1 255.255.255.252
 no shutdown
!
! Both server networks, 192.168.2.0/28 and 192.168.2.48/28, are inside 192.168.2.0/24: one route covers them.
ip route 192.168.2.0 255.255.255.0 10.0.0.2
!
end
