hostname sw1
!
! Every port is an access port in VLAN 1, so all four cables share one network: 192.168.1.0/24.
! portfast: these ports go to hosts and a router, so they start forwarding straight away.
interface GigabitEthernet1
 description r1 (the gateway)
 spanning-tree portfast
!
interface GigabitEthernet2
 description laptop
 spanning-tree portfast
!
interface GigabitEthernet3
 description printer
 spanning-tree portfast
!
interface GigabitEthernet4
 description broken-pc
 spanning-tree portfast
!
end
